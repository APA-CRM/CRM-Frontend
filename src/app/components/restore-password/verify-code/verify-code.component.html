<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md p-6 bg-white rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Verification code has been sent to your e-mail</h2>

    <form (ngSubmit)="onSubmit()" [formGroup]="verifyForm" class="space-y-7">

      <div>
        <p-inputgroup>
          <p-inputgroup-addon>
            <i class="pi pi-asterisk"></i>
          </p-inputgroup-addon>
          <p-floatlabel>
            <label for="verificationCode">Verification Code</label>
            <input class="w-full" formControlName="verificationCode" id="verificationCode" pInputText/>
          </p-floatlabel>
        </p-inputgroup>
        <div *ngIf="isInvalidField('verificationCode')" class="text-red-500 text-sm mt-1">
          Verification code is required.
        </div>
      </div>

      <button [disabled]="verifyForm.invalid" [loading]="isLoading" class="w-full" label="Verify code" pButton
              type="submit"></button>

    </form>
  </div>
</div>
