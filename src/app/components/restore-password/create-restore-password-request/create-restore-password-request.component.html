<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md p-6 bg-white rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Enter email</h2>

    <form (ngSubmit)="onSubmit()" [formGroup]="verifyForm" class="space-y-7">

      <div>
        <p-inputgroup>
          <p-inputgroup-addon>
            <i class="pi pi-envelope"></i>
          </p-inputgroup-addon>
          <p-floatlabel>
            <label for="email">Email</label>
            <input class="w-full" formControlName="email" id="email" pInputText/>
          </p-floatlabel>
        </p-inputgroup>
        <div *ngIf="isInvalidField('email')" class="text-red-500 text-sm mt-1">
          Email is required.
        </div>
      </div>

      <button [disabled]="verifyForm.invalid" [loading]="isLoading" class="w-full" label="Send Verification Code" pButton
              type="submit"></button>

      <div class="text-center mt-2">
        <a (click)="goBackToLogin()" class="text-gray-600 hover:underline cursor-pointer transition-all duration-300">
          Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
