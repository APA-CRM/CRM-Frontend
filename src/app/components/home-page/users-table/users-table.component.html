<div class="main-content ml-[250px] p-6">
    <p-table [value]="users" [paginator]="true" [totalRecords]="totalElements" [rows]="size"
    [loading]="loading" (onLazyLoad)="onLazeLoadUsers($event)">
        <ng-template #header>
            <tr>
                <th>Login</th>
                <th>Email</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Roles</th>
            </tr>
            <tr>
                <th>
                    <p-columnFilter type="text" field="login" placeholder="Search by login"
                        ariaLabel="Filter Login"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter type="text" field="email" placeholder="Search by email"
                        ariaLabel="Filter Email"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter type="text" field="firstName" placeholder="Search by first name"
                        ariaLabel="Filter First Name"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter type="text" field="lastName" placeholder="Search by last name"
                        ariaLabel="Filter Last Name"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter type="text" field="roles" placeholder="Search by roles"
                        ariaLabel="Filter roles"></p-columnFilter>
                </th>
            </tr>
        </ng-template>
        <ng-template #body>
            @for (user of users; track $index) {
            <tr>
                <td>{{ user.login }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.firstName }}</td>
                <td>{{ user.lastName }}</td>
                <td>
                    @for (role of user.roles; track $index) {
                    <p-tag severity="success" [value]="role.name" class="mr-2" />
                    }
                </td>
            </tr>
            }
        </ng-template>
    </p-table>
</div>
