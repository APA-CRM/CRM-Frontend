<div class="main-content ml-[250px] p-6">
    <div>
        <button pButton type="button" icon="pi pi-filter" class="mr-3 p-2" (click)="applyFilter()">Apply Filter</button>
        <span class="pi pi-filter-slash cursor-pointer" title="Reset Filter" (click)="resetFilter()"></span>
    </div>
    <p-table [value]="users" [paginator]="true" [totalRecords]="totalElements" [rows]="size" [loading]="loading"
        (onLazyLoad)="onLazeLoadUsers($event)">
        <ng-template #header>
            <tr>
                <th>Login</th>
                <th>Email</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Roles</th>
            </tr>
            <tr>
                <th>
                    <input pInputText type="text" [(ngModel)]="filter.login"  placeholder="Search by login" class="w-full" />
                </th>
                <th>
                    <input pInputText type="text" [(ngModel)]="filter.email"  placeholder="Search by email" class="w-full" />
                </th>
                <th>
                    <input pInputText type="text" [(ngModel)]="filter.firstName" placeholder="Search by first" class="w-full"/>
                    <th>
                        <input pInputText type="text" [(ngModel)]="filter.lastName"  placeholder="Search by last name" class="w-full" />
                    </th>
                    <th>
                        <input pInputText type="text" placeholder="Search by role" class="w-full" />
                    </th>
                </tr>
                <tr>
                    <td colspan="6" >
                    </td>
                </tr>
        </ng-template>
        <ng-template #body let-user>
            <tr>
                <td>{{ user.login }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.firstName || 'Not specified' }}</td>
                <td>{{ user.lastName || 'Not specified' }}</td>
                <td>
                    <span *ngFor="let role of user.roles">
                        <p-tag severity="success" [value]="role.name" class="mr-2" />
                    </span>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
