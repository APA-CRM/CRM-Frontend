<div class="min-h-screen ml-[250px] p-6 space-y-10">
    <app-create-role (roleCreated)="onRoleCreated()" />
    <input type="text" pInputText [(ngModel)]="roleName" placeholder="🔍 Search roles by name"
        class="w-full max-w-md ml-4 px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition duration-200" />
    <div>
        <p-divider align="center" type="solid">
            <b>All Roles</b>
        </p-divider>
    </div>
    <app-roles-table [searchRoleName]="roleName" [refreshTrigger]="refreshFlag"></app-roles-table>
</div>
