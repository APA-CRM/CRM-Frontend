<div class="min-h-screen p-6 bg-gray-50">
  <div *ngIf="loading" class="flex justify-center items-center min-h-[70vh]">
    <p-progressSpinner></p-progressSpinner>
  </div>

  <div *ngIf="!loading && organizations.length > 0" class="max-w-4xl mx-auto">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Choose organization</h2>

    <div class="flex flex-col items-center gap-6">
      <p-card
        (click)="selectOrganization(org)"
        *ngFor="let org of organizations"
        class="w-80 text-center cursor-pointer hover:shadow-lg transition-shadow border-0">

        <ng-template pTemplate="header">
          <div class="flex flex-col items-center justify-center">
            <!-- <p-avatar icon="pi pi-building" styleClass="bg-primary text-white mb-2" size="large" shape="circle"/> -->
            <p class="text-2xl font-bold text-gray-800 mt-6">{{ org.name }}</p>
          </div>
        </ng-template>
        <p class="mt-3 text-sm text-gray-600">Choose to login in organization</p>
      </p-card>
    </div>
  </div>

  <div *ngIf="!loading && organizations.length === 0"
       class="flex flex-col justify-center items-center min-h-screen text-center">
    <p-message severity="info" size="large" text="You don't have any organization"/>
    <button
      (click)="createOrganization()"
      class="p-button-success mt-4 text-base px-5 py-3"
      icon="pi pi-plus"
      label="Create organization"
      pButton
      type="button">
    </button>
  </div>
</div>
