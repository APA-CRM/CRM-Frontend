<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md p-6 bg-white rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-7">

      <div>
        <p-inputgroup>
          <p-inputgroup-addon>
            <i class="pi pi-user"></i>
          </p-inputgroup-addon>
          <p-floatlabel>
            <label for="login">Login</label>
            <input pInputText id="login" formControlName="login" class="w-full" />
          </p-floatlabel>
        </p-inputgroup>
        <div *ngIf="isInvalidField('login')" class="text-red-500 text-sm mt-1">
          login is required.
        </div>
      </div>

      <div>
        <p-inputgroup>
          <p-inputgroup-addon>
            <i class="pi pi-unlock"></i>
          </p-inputgroup-addon>
          <p-floatlabel>
            <label for="password">Password</label>
            <input pInputText type="password" id="password" formControlName="password" class="w-full">
          </p-floatlabel>
        </p-inputgroup>
        <div *ngIf="isInvalidField('password')" class="text-red-500 text-sm mt-1">
          Password is required.
        </div>
      </div>

      <button pButton type="submit" label="Login" class="w-full " [disabled]="loginForm.invalid"></button>
    </form>
  </div>
</div>
