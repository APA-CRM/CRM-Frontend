name: Frontend CI/CD
env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  IMAGE_NAME: aappaa/frontend-angular
  IMAGE_TAG: ${{ (github.head_ref || github.ref_name) == 'main' && 'latest' || (github.head_ref || github.ref_name) }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          node-version: '19'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint || echo "Linting failed, but conituing..."

      - name: Run tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: success() && (env.BRANCH_NAME == 'develop' || env.BRANCH_NAME == 'main')
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build Docker Image and Push
        if: success() && (env.BRANCH_NAME == 'develop' || env.BRANCH_NAME == 'main')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
